<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Koki - Bootstrap Admin Dashboard </title>
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon.png">
    <link href="./vendor/sweetalert2/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="./vendor/bootstrap-select/dist/css/bootstrap-select.min.css" rel="stylesheet">
    <link href="./vendor/lightgallery/css/lightgallery.min.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">

</head>

<body>

    <!--*******************
        Preloader start
    ********************-->
    <div data-layout="preloader"></div>
    <!--*******************
        Preloader end
    ********************-->


    <!--**********************************
        Main wrapper start
    ***********************************-->
    <div id="main-wrapper">

        <!--**********************************
            Nav header start
        ***********************************-->
        <div data-layout="nav"></div>
        <!--**********************************
            Nav header end
        ***********************************-->
		
		<!--**********************************
            Chat box start
        ***********************************-->
		<div data-layout="chat"></div>
		<!--**********************************
            Chat box End
        ***********************************-->


		
		
        <!--**********************************
            Header start
        ***********************************-->
        <div data-layout="header"></div>
        <!--**********************************
            Header end ti-comment-alt
        ***********************************-->

        <!--**********************************
            Sidebar start
        ***********************************-->
        <div data-layout="sidebar"></div>
        <!--**********************************
            Sidebar end
        ***********************************-->

        <!--**********************************
            Content body start
        ***********************************-->
        <div class="content-body">
            <div class="container-fluid">
                <div class="row page-titles">
                    <div class="col-sm-6 p-md-0">
                        <div class="welcome-text">
                            <h4>Hi, welcome back!</h4>
                            <p class="mb-0">Your business dashboard template</p>
                        </div>
                    </div>
                    <div class="col-sm-6 p-md-0 justify-content-sm-end mt-2 mt-sm-0 d-flex">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="javascript:void(0)">Plugins</a></li>
                            <li class="breadcrumb-item active"><a href="javascript:void(0)">Light Gallery</a></li>
                        </ol>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                                <div class="card-header">
									<h4 class="card-title">Light Gallery</h4>
								</div>
								<div class="card-body">
									<div id="lightgallery" class="row">
										<a href="images/gallery/pic1.jpg" data-exthumbimage="images/gallery/pic1.jpg" data-src="images/gallery/pic1.jpg" class="col-3 col-sm-6 col-md-3">
											<img src="images/gallery/pic1.jpg" class="w-100"/>
										</a>
										<a href="images/gallery/pic2.jpg" data-exthumbimage="images/gallery/pic2.jpg" data-src="images/gallery/pic2.jpg" class="col-3 col-sm-6 col-md-3">
											<img src="images/gallery/pic2.jpg" class="w-100" />
										</a>
										<a href="images/gallery/pic3.jpg" data-exthumbimage="images/gallery/pic3.jpg" data-src="images/gallery/pic3.jpg" class="col-3 col-sm-6 col-md-3">
											<img src="images/gallery/pic3.jpg" class="w-100" />
										</a>
										<a href="images/gallery/pic4.jpg" data-exthumbimage="images/gallery/pic4.jpg" data-src="images/gallery/pic4.jpg" class="col-3 col-sm-6 col-md-3">
											<img src="images/gallery/pic4.jpg" class="w-100" />
										</a>
									</div>
								</div>
                        </div>
                        <!-- /# card -->
                    </div>
                </div>
			</div>
        </div>
        <!--**********************************
            Content body end
        ***********************************-->


        <!--**********************************
            Footer start
        ***********************************-->
        <div data-layout="footer"></div>
        <!--**********************************
            Footer end
        ***********************************-->

        <!--**********************************
           Support ticket button start
        ***********************************-->

        <!--**********************************
           Support ticket button end
        ***********************************-->

        
    </div>
    <!--**********************************
        Main wrapper end
    ***********************************-->

    <!--**********************************
        Scripts
    ***********************************-->
    <!-- Required vendors -->
    <script src="./js/layout-loader.js"></script>
    <script src="./vendor/global/global.min.js"></script>
	<script src="./vendor/bootstrap-select/dist/js/bootstrap-select.min.js"></script>
    <script src="./js/custom.min.js"></script>
	<script src="./js/deznav-init.js"></script>
	
	<script src="./vendor/lightgallery/js/lightgallery-all.min.js"></script>
	<script>
		$('#lightgallery').lightGallery({
			loop:true,
			thumbnail:true,
			exThumbImage: 'data-exthumbimage'
		});
	</script>
</body>
</html>
